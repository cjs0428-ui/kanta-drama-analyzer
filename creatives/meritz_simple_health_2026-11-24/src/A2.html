<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:P;src:url(fontp/Pretendard-Bold.otf);font-weight:700}@font-face{font-family:P;src:url(fontp/Pretendard-ExtraBold.otf);font-weight:800}@font-face{font-family:P;src:url(fontp/Pretendard-Regular.otf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}#a{width:800px;background:#fff;font-family:P;color:#151515;overflow:hidden}
.top{display:block;width:800px}

.tx span i{font-style:normal;color:#1f5cf5}
</style></head><body><div id="a"><img class="top" src="a_top.png"><div class="bt"><h2>병력 있어도,<br><em>내 보험료 먼저 확인</em></h2><div class="lead">혈압이 높아도 포기하지 마세요!<br>간편심사 기준으로 내 보험료를 계산해 드려요</div><div class="st"><div class="it"><div class="nb">1</div><div class="tx"><b>혈압 높으면 가입 자체가 안 된다?</b><span>→ <i>간편심사로 가입을 검토할 수 있어요</i></span></div></div><div class="it"><div class="nb">2</div><div class="tx"><b>증상 없으면 안 알려도 된다?</b><span>→ <i>질문별로 확인하고 알려야 해요</i></span></div></div></div></div></div></body></html>
