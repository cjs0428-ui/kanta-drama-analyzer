<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:P;src:url(fontp/Pretendard-Bold.otf);font-weight:700}@font-face{font-family:P;src:url(fontp/Pretendard-ExtraBold.otf);font-weight:800}@font-face{font-family:P;src:url(fontp/Pretendard-Regular.otf);font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}#a{width:800px;background:#fff;font-family:P;color:#151515;overflow:hidden}
.top{display:block;width:800px}
.bt{padding:38px 40px 52px}
h2{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1.25}h2 em{font-style:normal;color:#E5262A}
.lead{font-size:23px;color:#888;margin-top:10px;letter-spacing:-.6px;line-height:1.45}
.st{position:relative;margin-top:36px}
.it{display:flex;gap:26px;align-items:flex-start;position:relative;padding-bottom:34px}
.it:last-child{padding-bottom:0}
.it:not(:last-child):after{content:"";position:absolute;left:33px;top:74px;bottom:6px;width:2px;background:#d6d6d6}
.nb{flex:none;width:66px;height:66px;border-radius:50%;background:#e6e6e6;color:#333;font-size:34px;font-weight:400;display:flex;align-items:center;justify-content:center}
.it.c{align-items:center}.it.c .tx b{margin-top:0}.it.c:not(:last-child):after{top:70px;bottom:-2px}
.tx b{display:block;font-size:34px;font-weight:800;letter-spacing:-1.6px;line-height:1.25;margin-top:6px}
.tx span{display:block;font-size:25px;color:#8a8a8a;letter-spacing:-.8px;margin-top:6px}
.tx span i{font-style:normal;color:#1f5cf5}
</style></head><body><div id="a"><img class="top" src="b_top.png"><div class="bt"><h2><em>내 보험료</em> 확인</h2><div class="lead"><b style="color:#E5262A">보험료부터 계산</b>하고, 일반심사도 가능한지<br>전문 상담사와 함께 확인해요</div><div class="st"><div class="it c"><div class="nb">1</div><div class="tx"><b>3개월 내 재검사 소견</b></div></div><div class="it c"><div class="nb">2</div><div class="tx"><b>2년 내 입원·수술</b></div></div><div class="it c"><div class="nb">3</div><div class="tx"><b>5년 내 암 등 진단</b></div></div></div></div></div></body></html>
