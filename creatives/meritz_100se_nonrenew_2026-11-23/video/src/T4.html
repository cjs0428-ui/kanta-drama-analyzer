<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:P;src:url(fontp/Pretendard-Black.otf);font-weight:900}@font-face{font-family:P;src:url(fontp/Pretendard-ExtraBold.otf);font-weight:800}@font-face{font-family:P;src:url(fontp/Pretendard-SemiBold.otf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:transparent}#a{position:relative;width:1080px;height:1920px;font-family:P}
.lg{position:absolute;right:40px;top:56px;display:flex;align-items:center;gap:10px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}.lg img{height:44px}.lg span{color:#fff;font-size:30px;font-weight:800}
.cap{position:absolute;left:0;right:0;text-align:center}
.cap div{display:inline-block;background:#111;color:#fff;font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1.22;padding:8px 22px;margin:3px 0}
.cap em{font-style:normal;color:#FFD84A}
.sh{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72) 30%,rgba(0,0,0,.8))}
.nt{position:absolute;left:24px;right:24px;text-align:center;color:#fff;font-size:48px;font-weight:600;line-height:1.24;letter-spacing:-1.8px;text-shadow:0 2px 5px rgba(0,0,0,.6)}
.tt{position:absolute;left:0;right:0;top:170px;text-align:center;transform:rotate(-2.5deg)}
.tt span{display:inline-block;font-size:112px;font-weight:900;letter-spacing:-4px;line-height:1.1;color:#fff;-webkit-text-stroke:16px #111;paint-order:stroke fill;text-shadow:0 10px 0 #111,0 0 40px rgba(0,0,0,.35)}
.tt em{font-style:normal;color:#FF3B30}.tt b{color:#FFD84A}
</style></head><body><div id="a"><div class="tt"><span>갱신 때마다<br><em>계단식?!</em></span></div></div></body></html>
