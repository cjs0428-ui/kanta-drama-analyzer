<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fj/400.css"><style>@font-face{font-family:P;src:url(fontp/Pretendard-Black.otf);font-weight:900}@font-face{font-family:P;src:url(fontp/Pretendard-ExtraBold.otf);font-weight:800}@font-face{font-family:P;src:url(fontp/Pretendard-Medium.otf);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}#a{position:relative;width:1080px;height:1080px;overflow:hidden;font-family:P;background:#fff}
.hdr{position:absolute;left:40px;right:40px;top:24px;height:52px;display:flex;align-items:center;justify-content:space-between}.hdr img{height:42px}.hdr span{font-size:27px;font-weight:800;color:#222}
.pn{position:absolute;border:6px solid #111;overflow:hidden;background:#fff}.pn img{position:absolute;width:100%;height:100%;object-fit:cover}
.cb{position:absolute;background:#FFE14D;border:4px solid #111;box-shadow:5px 5px 0 #111;padding:8px 18px;font-family:'Jua';font-size:38px;line-height:1.15;color:#111}
.bb{position:absolute;background:#fff;border:5px solid #111;border-radius:38px;padding:12px 24px;font-family:'Jua';font-size:42px;line-height:1.12;color:#111;text-align:center}
.bb em{font-style:normal;color:#E5262A}
.red{position:absolute;left:0;right:0;top:996px;text-align:center;font-size:25px;font-weight:900;color:#E5262A;letter-spacing:-1px}
.gr{position:absolute;left:0;right:0;top:1034px;text-align:center;font-size:17px;font-weight:500;color:#444;line-height:1.45}
</style></head><body><div id="a">
<div class="hdr"><img src="meritz_logo.png"><span>올바른 100세 건강보험</span></div>
<div class="pn" style="left:36px;top:90px;width:1008px;height:432px"><img src="q1.png" style="width:1250px;height:536px;left:-250px;top:-50px"></div>
<div class="cb" style="left:54px;top:106px;transform:rotate(-2deg)">아침부터 갱신 알림…</div>
<div class="bb" style="right:60px;top:400px;transform:rotate(2deg)">보험료가 <em>또 올랐다고?!</em></div>
<div class="pn" style="left:36px;top:538px;width:498px;height:446px"><img src="q2.png" style="object-position:50% 70%"></div>
<div class="cb" style="left:52px;top:552px">나이 들수록,<br>갱신 때마다 <span style="color:#E5262A">↑</span></div>
<div class="pn" style="left:546px;top:538px;width:498px;height:446px"><img src="q3.png" style="object-position:50% 80%"></div>
<div class="bb" style="left:566px;top:552px;font-size:34px">가입할 때 보험료<br><em>끝까지 그대로!</em></div>
<div class="cb" style="right:52px;top:916px;background:#E5262A;color:#fff">비갱신형!</div>
<div class="red">비갱신형: 납입기간 동안 보험료 변동 없음 · 갱신형 대비 초기 보험료가 높을 수 있음</div>
<div class="gr">*보장 범위 및 지급 조건은 약관에 따릅니다. 보험계약 체결 전 상품설명서 및 약관을 반드시 읽어보시기 바랍니다.<br>메리츠화재 준법감시인 심의필 제OOOO-광고-OOOO호 (OOOO.OO.OO~OOOO.OO.OO)</div>
</div></body></html>
